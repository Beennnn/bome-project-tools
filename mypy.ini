# Type checking, read by the CI and by any local `mypy` run from the repo root.
#
# Default mode plus check_untyped_defs, not --strict: strict asks for ~200 annotations,
# almost all on test methods, and would find nothing the bodies do not already show.
# check_untyped_defs is what makes the tests count -- without it mypy skips the body of
# every unannotated function, which is most of tests/.
[mypy]
# mypy 2.x cannot target 3.9; the suite itself still runs on 3.9 in CI.
python_version = 3.10
files = bome_project, tests, examples
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
strict_equality = True

# mido is optional (probe imports it lazily) and ships no type information.
[mypy-mido.*]
ignore_missing_imports = True
