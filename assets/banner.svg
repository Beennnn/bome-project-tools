<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="bome-project-tools — read, audit and safely rewrite Bome MIDI Translator project files">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="gT" gradientUnits="userSpaceOnUse" x1="72" y1="120" x2="640" y2="120">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gWeb" gradientUnits="userSpaceOnUse" x1="780" y1="90" x2="900" y2="290">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gStar" gradientUnits="userSpaceOnUse" x1="1030" y1="90" x2="1210" y2="290">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- title -->
  <text x="72" y="132" font-family="-apple-system, Segoe UI, sans-serif" font-size="58" font-weight="700" fill="url(#gT)">bome-project-tools</text>
  <text x="72" y="176" font-family="-apple-system, Segoe UI, sans-serif" font-size="23" fill="#aab4d8">Read, audit and safely rewrite Bome MIDI Translator projects</text>
  <text x="72" y="209" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" fill="#7f8bb5">a <tspan font-style="italic">.bmtp</tspan> format nobody documented — nine rules, each paid for once</text>

  <!-- the format, as it really looks -->
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <text x="72" y="262" fill="#7f8bb5">Incoming0=MID3&lt;Incoming …&gt;<tspan fill="#4a5578">   one translator, four keys</tspan></text>
    <text x="72" y="286" fill="#7f8bb5">Outgoing0=None<tspan fill="#4a5578">              emits nothing — a free slot</tspan></text>
    <text x="72" y="310" fill="#7f8bb5">Options0=…StMa00000004…<tspan fill="#4a5578">     eight hex: the rule COUNT</tspan></text>
  </g>

  <!-- N x M becomes N + M : the mesh, then the star -->
  <g stroke-linecap="round" fill="none">
    <!-- mesh: 4 sources, 3 destinations, every crossing drawn -->
    <g stroke="url(#gWeb)" stroke-width="1.3">
      <path d="M786 104 L886 128 M786 104 L886 190 M786 104 L886 252"/>
      <path d="M786 152 L886 128 M786 152 L886 190 M786 152 L886 252"/>
      <path d="M786 200 L886 128 M786 200 L886 190 M786 200 L886 252"/>
      <path d="M786 248 L886 128 M786 248 L886 190 M786 248 L886 252"/>
    </g>
    <g fill="#f43f5e" stroke="none" opacity="0.9">
      <circle cx="786" cy="104" r="4.5"/><circle cx="786" cy="152" r="4.5"/>
      <circle cx="786" cy="200" r="4.5"/><circle cx="786" cy="248" r="4.5"/>
    </g>
    <g fill="#f43f5e" stroke="none" opacity="0.55">
      <circle cx="886" cy="128" r="4.5"/><circle cx="886" cy="190" r="4.5"/>
      <circle cx="886" cy="252" r="4.5"/>
    </g>
    <text x="786" y="298" font-family="Menlo, Consolas, monospace" font-size="15" fill="#f43f5e" stroke="none" opacity="0.9">4 × 3 = 12</text>

    <!-- arrow -->
    <path d="M950 190 L1000 190" stroke="#7f8bb5" stroke-width="1.6"/>
    <path d="M992 183 L1000 190 L992 197" stroke="#7f8bb5" stroke-width="1.6"/>

    <!-- star: everything meets in one named event, then fans out -->
    <g stroke="url(#gStar)" stroke-width="1.6">
      <path d="M1046 104 L1116 190 M1046 152 L1116 190 M1046 200 L1116 190 M1046 248 L1116 190"/>
      <path d="M1116 190 L1194 128 M1116 190 L1194 190 M1116 190 L1194 252"/>
    </g>
    <g fill="#22d3ee" stroke="none">
      <circle cx="1046" cy="104" r="4.5"/><circle cx="1046" cy="152" r="4.5"/>
      <circle cx="1046" cy="200" r="4.5"/><circle cx="1046" cy="248" r="4.5"/>
    </g>
    <circle cx="1116" cy="190" r="7" fill="#6366f1" stroke="#22d3ee" stroke-width="1.6"/>
    <g fill="#6366f1" stroke="none">
      <circle cx="1194" cy="128" r="4.5"/><circle cx="1194" cy="190" r="4.5"/>
      <circle cx="1194" cy="252" r="4.5"/>
    </g>
    <text x="1046" y="298" font-family="Menlo, Consolas, monospace" font-size="15" fill="#22d3ee" stroke="none">4 + 3 = 7</text>
    <text x="1116" y="228" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#aab4d8" stroke="none">Perform</text>
  </g>
</svg>
